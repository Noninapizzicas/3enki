[package]
name = "motor-coherencia"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Juez de COHERENCIA de operaciones de enki-sense: valora si un acto (ej. fs.write) es coherente; crear/escribir de cero fluye, borrar/truncar pide confirmación. Determinista, puro, local. Se conecta al bus por MQTT."

[[bin]]
name = "motor-coherencia"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# MQTT sobre TCP (1883) — sin TLS: el motor es co-ubicado con el broker embebido.
rumqttc = { version = "0.24", default-features = false }
