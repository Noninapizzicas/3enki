[package]
name = "enki-wa-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Puente WhatsApp (protocolo WhatsApp Web / QR) para Enki: N sesiones en un proceso con API HTTP local"
license = "MIT"

# El protocolo vive en whatsapp-rust (oxidezap). Se pinea por REV, no por rama:
# un clon del repo Enki debe construir exactamente el binario que corre en la VPS.
# Para subir de versión: cambiar rev, `cargo build --release`, y probar QR + /send.
[dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "0a6ae107810e6f4e2d73bbda0bebe12208472a58" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "io-std", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[[bin]]
name = "enki-wa-bridge"
path = "main.rs"
