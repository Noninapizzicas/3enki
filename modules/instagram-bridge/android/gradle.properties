# La JVM de Gradle. 2 GB bastan para un modulo; mas memoria no acelera nada.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

# La cache de configuracion se deja apagada mientras se depura el borde JNI: la
# tarea que compila el crate lee variables de entorno (ANDROID_NDK_HOME) y
# reutilizar una configuracion vieja es como construir contra otro NDK sin
# enterarse.
org.gradle.configuration-cache=false

# Ni una ABI de 32 bits: el crate enlaza a 16 KiB solo en 64 bits y minSdk 26 no
# necesita armeabi-v7a. Empaquetar una ABI que no se prueba es peso muerto.
