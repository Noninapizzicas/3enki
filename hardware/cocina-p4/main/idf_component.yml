## Dependencias gestionadas por el component manager de ESP-IDF.
## `idf.py build` las descarga solo (necesita red la primera vez).
## Versiones verificadas contra https://components.espressif.com el 2026-10-30.

dependencies:
  # esp_lcd_jd9365 pide >=5.4; el codigo usa MIPI-DSI (>=5.3) y el macro de
  # timing JD9365_800_1280_PANEL_60HZ_DPI_CONFIG() solo existe para IDF <6.
  idf: ">=5.4,<6.0"

  # --- Panel: JD9365 por MIPI-DSI (NO hay BSP de la placa) ---------------
  # Driver oficial del controlador: espressif/esp_lcd_jd9365 v2.0.2
  #   targets: esp32p4 · "ESP LCD JD9365(MIPI-DSI)"
  #   expone esp_lcd_new_panel_jd9365(), JD9365_PANEL_BUS_DSI_2CH_CONFIG(),
  #   JD9365_PANEL_IO_DBI_CONFIG(), JD9365_800_1280_PANEL_60HZ_DPI_CONFIG()
  espressif/esp_lcd_jd9365: "^2.0.2"

  # --- Tactil: GT911 por I2C ---------------------------------------------
  # esp_lcd_touch_gt911 v1.2.1 -> esp_lcd_touch_new_i2c_gt911()
  # El bus I2C lo crea main.c con driver/i2c_master (driver nuevo de IDF 5.x).
  espressif/esp_lcd_touch: "^1.2.1"
  espressif/esp_lcd_touch_gt911: "^1.2.1"

  # --- Puente LVGL 9 <-> esp_lcd (lo que antes hacia el BSP) ------------
  # esp_lvgl_port v2.9.0: lvgl_port_init(), lvgl_port_add_disp_dsi(),
  # lvgl_port_add_touch(), lvgl_port_lock()/unlock().
  espressif/esp_lvgl_port: "^2.9.0"

  # LVGL 9: la UI usa API v9 (lv_display_*, lv_obj_*, lv_anim_*).
  lvgl/lvgl: "^9.2.0"

  # WiFi 6 / BLE del ESP32-C6 por SDIO (esp_hosted).
  # Versiones alineadas con el firmware del C6 que trae la placa: la rama
  # IDF 5.x usa esp_hosted 1.4.x + esp_wifi_remote 0.14.x
  espressif/esp_hosted: "1.4.7"
  espressif/esp_wifi_remote: "0.14.5"
