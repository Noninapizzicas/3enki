name: APK Instagram Bridge

on:
  workflow_dispatch:
  push:
    branches: [ proyecto/instagram-bridge ]
    paths:
      - 'modules/instagram-bridge/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # intenta r30; si no existe, la primera LTS disponible
          if ! sdkmanager --install "ndk;30.0.16248370" > /dev/null 2>&1; then
            echo "r30 no disponible, buscando alternativa..."
            CAND=$(sdkmanager --list 2>/dev/null | grep -oE "ndk;[0-9.]+" | sort -u | tail -1)
            echo "instalando $CAND"
            yes | sdkmanager --install "$CAND"
          fi
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK instalado en $NDK_DIR"

      - name: Rust
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Tests del crate (gate)
        working-directory: modules/instagram-bridge/crate
        run: cargo test --offline || cargo test

      - name: Compilar APK
        working-directory: modules/instagram-bridge/android
        run: |
          gradle wrapper --gradle-version 8.9 || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bridge-apk
          path: modules/instagram-bridge/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
