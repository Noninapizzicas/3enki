name: APK Instagram Bridge

on:
  workflow_dispatch:
  push:
    branches: [ proyecto/instagram-bridge ]
    paths:
      - 'modules/instagram-bridge/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK y NDK (licencias aceptadas sin preguntar)
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

          # 'yes' delante: sin esto se queda esperando (y/N) y el job muere
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "SDK base instalado"

          NDK_PKG=$(sdkmanager --list 2>/dev/null | grep -oE "ndk;[0-9.]+" | sort -uV | tail -1)
          echo "instalando $NDK_PKG"
          sdkmanager --install "$NDK_PKG" > /dev/null
          NDK_VER=${NDK_PKG#ndk;}
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "NDK en $ANDROID_HOME/ndk/$NDK_VER"
          ls "$ANDROID_HOME/ndk/$NDK_VER" | head -3

      - name: Rust y cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Tests del crate (gate)
        working-directory: modules/instagram-bridge/crate
        run: cargo test --offline || cargo test

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: modules/instagram-bridge/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bridge-apk
          path: modules/instagram-bridge/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
